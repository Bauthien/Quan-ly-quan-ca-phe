{% load static %}
<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justine Coffee - Bản đồ</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
            margin: 20px 0;
        }

        #map {
            width: 90%;
            height: 600px;
            margin: auto;
            border: 2px solid #ccc;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h2>📍 Justine Coffee</h2>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Tạo bản đồ
        var map = L.map('map').setView([10.762622, 106.660172], 15);

        // Hiển thị nền bản đồ OpenStreetMap
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap Contributors'
        }).addTo(map);

        // Đánh dấu vị trí quán
        L.marker([10.762622, 106.660172])
            .addTo(map)
            .bindPopup("<b>Justine Coffee</b><br>Chào mừng bạn!")
            .openPopup();
    </script>

</body>

</html>
