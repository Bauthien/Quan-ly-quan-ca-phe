<div class="popover-wrapper">
  <button class="btn btn-outline" id="popoverTrigger" aria-haspopup="dialog" aria-expanded="false">
    Mở popover
  </button>

  <div class="popover-content" id="popoverContent" role="dialog">
    <div class="popover-header">
      <h4 class="popover-title">Kích thước</h4>
      <p class="popover-desc">Đặt kích thước cho lớp này.</p>
    </div>

    <div class="popover-field">
      <label for="width-input">Chiều rộng</label>
      <input type="text" id="width-input" class="popover-input" value="100%" />
    </div>
    <div class="popover-field">
      <label for="height-input">Chiều cao</label>
      <input type="text" id="height-input" class="popover-input" value="25px" />
    </div>
  </div>
</div>
