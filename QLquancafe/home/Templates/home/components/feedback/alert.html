<!-- Alert mặc định (default) -->
<div class="alert alert-default" role="alert">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
    <circle cx="12" cy="12" r="10" />
    <path d="M12 16v-4" />
    <path d="M12 8h.01" />
  </svg>
  <div class="alert-title">Thông báo</div>
  <div class="alert-description">
    <p>Đây là nội dung thông báo thông thường dành cho bạn.</p>
  </div>
</div>

<!-- Alert dạng lỗi (destructive) -->
<div class="alert alert-destructive" role="alert">
  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="alert-icon">
    <circle cx="12" cy="12" r="10" />
    <path d="M12 8v4" />
    <path d="M12 16h.01" />
  </svg>
  <div class="alert-title">Đã xảy ra lỗi</div>
  <div class="alert-description">
    <p>Không thể xử lý yêu cầu của bạn. Vui lòng thử lại sau.</p>
  </div>
</div>

<!-- Alert không có icon -->
<div class="alert alert-default" role="alert">
  <div class="alert-title">Không có icon</div>
  <div class="alert-description">
    <p>Alert vẫn hiển thị đúng bố cục dù không có icon.</p>
  </div>
</div>
