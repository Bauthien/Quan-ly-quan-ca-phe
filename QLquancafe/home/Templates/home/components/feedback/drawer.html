<button class="btn btn-primary" id="openDrawerBtn">Mở ngăn kéo</button>

<div class="drawer-overlay" id="drawerOverlay"></div>

<div class="drawer-content drawer-bottom" id="drawerContent" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" aria-describedby="drawerDesc">
  <!-- Thanh kéo nhỏ, chỉ hiện khi hướng là bottom -->
  <div class="drawer-handle"></div>

  <div class="drawer-header">
    <h2 class="drawer-title" id="drawerTitle">Chỉnh sửa mục tiêu</h2>
    <p class="drawer-description" id="drawerDesc">
      Đặt mục tiêu hàng ngày của bạn.
    </p>
  </div>

  <div class="drawer-body">
    <p>Nội dung chính của drawer nằm ở đây.</p>
  </div>

  <div class="drawer-footer">
    <button class="btn btn-primary" id="submitBtn">Gửi</button>
    <button class="btn btn-outline" id="closeDrawerBtn">Hủy</button>
  </div>
</div>
