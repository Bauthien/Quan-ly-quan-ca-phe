<!-- Vùng bấm chuột phải để mở menu -->
<div class="context-menu-trigger" id="contextTrigger">
  Nhấn chuột phải vào đây
</div>

<!-- Menu (ẩn mặc định) -->
<div class="context-menu" id="contextMenu">
  <div class="context-menu-item" data-action="back">
    Quay lại
    <span class="context-menu-shortcut">⌘[</span>
  </div>
  <div class="context-menu-item" data-action="forward" data-disabled="true">
    Tiến tới
    <span class="context-menu-shortcut">⌘]</span>
  </div>
  <div class="context-menu-item" data-action="reload">
    Tải lại
    <span class="context-menu-shortcut">⌘R</span>
  </div>

  <!-- Submenu -->
  <div class="context-menu-sub">
    <div class="context-menu-sub-trigger" id="subTrigger">
      Thêm công cụ
      <svg class="chevron-right" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m9 18 6-6-6-6" />
      </svg>
    </div>
    <div class="context-menu-sub-content" id="subContent">
      <div class="context-menu-item" data-action="save-page">Lưu trang</div>
      <div class="context-menu-item" data-action="create-shortcut">Tạo lối tắt</div>
    </div>
  </div>

  <div class="context-menu-separator"></div>

  <!-- Checkbox item -->
  <div class="context-menu-checkbox-item" data-checked="true" id="checkboxItem">
    <span class="item-indicator">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </span>
    Hiện thanh dấu trang
  </div>

  <div class="context-menu-separator"></div>

  <div class="context-menu-label">Người dùng</div>

  <!-- Radio group -->
  <div class="context-menu-radio-item" data-value="pedro" data-checked="true">
    <span class="item-indicator">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10" /></svg>
    </span>
    Pedro Duarte
  </div>
  <div class="context-menu-radio-item" data-value="colm" data-checked="false">
    <span class="item-indicator"></span>
    Colm Tuite
  </div>
</div>
