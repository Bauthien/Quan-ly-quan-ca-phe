<div class="command">
  <div class="command-input-wrapper">
    <svg class="command-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
    </svg>
    <input type="text" class="command-input" id="commandInput" placeholder="Nhập lệnh hoặc tìm kiếm..." autocomplete="off" />
  </div>

  <div class="command-list" id="commandList">
    <div class="command-empty" id="commandEmpty" hidden>Không tìm thấy kết quả.</div>

    <div class="command-group" data-group>
      <div class="command-group-heading">Gợi ý</div>
      <div class="command-item" data-command-item tabindex="0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4M8 2v4M3 10h18" /></svg>
        <span>Lịch</span>
      </div>
      <div class="command-item" data-command-item tabindex="0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
        <span>Trình duyệt</span>
      </div>
      <div class="command-item" data-command-item tabindex="0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
        <span>Đồng hồ</span>
      </div>
    </div>

    <div class="command-separator"></div>

    <div class="command-group" data-group>
      <div class="command-group-heading">Cài đặt</div>
      <div class="command-item" data-command-item tabindex="0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3" /><path d="M12 1v6M12 17v6M4.2 4.2l4.2 4.2M15.5 15.5l4.2 4.2M1 12h6M17 12h6M4.2 19.8l4.2-4.2M15.5 8.5l4.2-4.2" /></svg>
        <span>Hồ sơ</span>
        <span class="command-shortcut">⌘P</span>
      </div>
      <div class="command-item" data-command-item tabindex="0">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" /><path d="M1 10h22" /></svg>
        <span>Thanh toán</span>
        <span class="command-shortcut">⌘B</span>
      </div>
    </div>
  </div>
</div>
