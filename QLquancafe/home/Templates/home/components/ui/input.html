<!-- Input văn bản thường -->
<input type="text" class="input" placeholder="Nhập tên của bạn" />

<!-- Input email -->
<input type="email" class="input" placeholder="you@example.com" />

<!-- Input mật khẩu -->
<input type="password" class="input" placeholder="Mật khẩu" />

<!-- Input số -->
<input type="number" class="input" placeholder="Số lượng" />

<!-- Input bị lỗi (invalid) -->
<input type="email" class="input" aria-invalid="true" value="email-khong-hop-le" />

<!-- Input disabled -->
<input type="text" class="input" placeholder="Không thể chỉnh sửa" disabled />

<!-- Input dạng file -->
<input type="file" class="input" />
