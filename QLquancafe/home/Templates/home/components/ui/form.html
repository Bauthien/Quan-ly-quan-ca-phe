<form id="myForm" novalidate>
  <!-- Form item: Email -->
  <div class="form-item">
    <label class="form-label" for="email-input" id="email-label">Email</label>
    <input
      type="email"
      id="email-input"
      class="form-control"
      aria-describedby="email-description"
      name="email"
      required
    />
    <p class="form-description" id="email-description">
      Chúng tôi sẽ không chia sẻ email của bạn với ai khác.
    </p>
    <p class="form-message" id="email-message" hidden></p>
  </div>

  <!-- Form item: Username -->
  <div class="form-item">
    <label class="form-label" for="username-input" id="username-label">Tên đăng nhập</label>
    <input
      type="text"
      id="username-input"
      class="form-control"
      aria-describedby="username-description"
      name="username"
      required
      minlength="3"
    />
    <p class="form-description" id="username-description">
      Đây là tên hiển thị công khai của bạn.
    </p>
    <p class="form-message" id="username-message" hidden></p>
  </div>

  <button type="submit" class="btn btn-primary">Gửi</button>
</form>
