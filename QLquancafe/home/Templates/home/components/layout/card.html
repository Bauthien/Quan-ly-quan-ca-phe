<!-- Card đầy đủ (header có action, content, footer có border-top) -->
<div class="card">
  <div class="card-header card-header-with-action">
    <h4 class="card-title">Tiêu đề thẻ</h4>
    <p class="card-description">Mô tả ngắn gọn cho nội dung bên dưới.</p>
    <div class="card-action">
      <button class="card-action-btn" aria-label="Tùy chọn">⋯</button>
    </div>
  </div>

  <div class="card-content">
    <p>Đây là nội dung chính của thẻ. Bạn có thể đặt bất kỳ nội dung nào ở đây: văn bản, ảnh, form...</p>
  </div>

  <div class="card-footer card-footer-border">
    <button class="btn btn-outline">Hủy</button>
    <button class="btn btn-primary">Xác nhận</button>
  </div>
</div>

<!-- Card đơn giản -->
<div class="card">
  <div class="card-header">
    <h4 class="card-title">Card đơn giản</h4>
    <p class="card-description">Chỉ có tiêu đề, mô tả và nội dung.</p>
  </div>
  <div class="card-content">
    <p>Nội dung của card ở đây.</p>
  </div>
</div>
